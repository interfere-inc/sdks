[package]
name = "interfere_sdk"
version = "0.1.0"
edition = "2021"
description = "Rust SDK for interfere_sdk generated by Fern"
license = "MIT"
repository = "https://github.com/fern-api/fern"
documentation = "https://docs.rs/interfere_sdk"

[lib]
doctest = false
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", features = [
  "json",
  "stream",
  "gzip",
], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dependencies.interfere_types]
path = "../interfere-types"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = ["multipart"]
multipart = ["reqwest/multipart"]
