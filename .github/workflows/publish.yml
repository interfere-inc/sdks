name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  pack:
    needs: verify
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci --ignore-scripts
      - id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - if: steps.mode.outputs.mode == 'publish'
        run: bun run build
      - if: steps.mode.outputs.mode == 'publish'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: ${{ runner.temp }}/cli-artifacts
          merge-multiple: true
      - name: Restore the CLI bundle and native binaries
        if: steps.mode.outputs.mode == 'publish'
        run: |
          for platform in $(jq -r '.[].platform' src/packages/public/cli/platforms.json); do
            tar -xzf "$RUNNER_TEMP/cli-artifacts/cli-$platform.tar.gz" -C src/packages/public/cli
          done
      - name: Strip workspace-only package conditions
        if: steps.mode.outputs.mode == 'publish'
        run: bun scripts/strip-package-conditions.ts .
      - id: pack
        if: steps.mode.outputs.mode == 'publish'
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    if: vars.NPM_PUBLISH_ENABLED == 'true' && needs.pack.outputs.pack-dir-artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: sdk
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /bun.lock
            /.changeset/
            /src/packages/*/*/package.json
            /src/packages/*/*/CHANGELOG.md
            /src/packages/*/*/platforms/*/package.json
            /src/packages/*/*/platforms/*/CHANGELOG.md
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Require npm with trusted publishing
        run: printf '11.5.1\n%s\n' "$(npm --version)" | sort --version-sort --check=quiet
      - name: Install the Changesets CLI outside the workspace
        run: npm install --prefix "$GITHUB_WORKSPACE" --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --before "$(git -C sdk log -1 --format=%cI)" "@changesets/cli@$(jq -er '.workspaces.catalog["@changesets/cli"]' sdk/package.json)" # zizmor: ignore[adhoc-packages]
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          cwd: sdk
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
        env:
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
