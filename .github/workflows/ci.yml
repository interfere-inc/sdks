name: CI

on:
  pull_request:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.11.4
          mise_toml: |
            [tools]
            gitleaks = "8.30.1"
          cache: false
      - run: gitleaks dir . --config .gitleaks.toml --no-banner --redact
      - run: bun ci --ignore-scripts
      - run: bunx --no-install playwright install --with-deps chromium
      - run: bun run build
      - run: bun run typecheck
      # WARNING: ubuntu-latest has 4 vCPUs; turbo --concurrency times --maxWorkers above that times out wall-clock tests.
      - run: bun run test --concurrency=2
        env:
          VITEST_ARGS: '["--maxWorkers=2"]'

  cli:
    permissions:
      contents: read
    uses: ./.github/workflows/cli.yml # zizmor: ignore[self-repository]
