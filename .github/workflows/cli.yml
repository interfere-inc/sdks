name: CLI

on:
  workflow_call:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: matrix
        run: echo "matrix=$(jq -c . src/packages/public/cli/platforms.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/packages/public/cli/.node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci --ignore-scripts
      - name: Regenerate the CLI client from the exported OpenAPI document
        working-directory: src/packages/public/cli
        run: |
          bunx --no-install fern generate --local --force
          grep -rlF '<CLI>' generated/src | xargs -r perl -pi -e 's/<CLI>/interfere/g'
          find generated -depth \( -name .agents -o -name .claude -o -name .github \) -exec rm -rf {} +
          git checkout -- generated/Cargo.toml generated/Cargo.lock generated/interfere-sdk/Cargo.toml generated/interfere-types/Cargo.toml
          git add --all generated
          git diff --cached --exit-code --stat -- generated

  build:
    name: CLI (${{ matrix.platform }})
    needs: generated
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generated.outputs.matrix) }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CLI_PLATFORM: ${{ matrix.platform }}
      CLI_SUFFIX: ${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - if: runner.os == 'macOS' && runner.arch == 'ARM64' && matrix.platform == 'darwin-x64'
        run: /usr/bin/pgrep -q oahd || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/packages/public/cli/.node-version
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: |
          rustup toolchain install
          rustup target add "$CARGO_BUILD_TARGET"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: |
            src/packages/public/cli
            src/packages/public/cli/generated
          key: cli-${{ matrix.target }}
      - run: bunx --no-install turbo run build typecheck test --filter=@interfere/cli --only
      - if: matrix.platform == 'linux-x64'
        run: bunx --no-install turbo run test:wire --filter=@interfere/cli --only
      - name: Pack the platform package
        working-directory: src/packages/public/cli
        run: |
          mkdir -p "platforms/$CLI_PLATFORM/bin" "$RUNNER_TEMP/cli-packages"
          cp "target/$CARGO_BUILD_TARGET/release/interfere$CLI_SUFFIX" "platforms/$CLI_PLATFORM/bin/"
          bun pm pack --ignore-scripts --destination "$RUNNER_TEMP/cli-packages"
          npm pack "./platforms/$CLI_PLATFORM" --pack-destination "$RUNNER_TEMP/cli-packages"
          tar -czf - dist/interfere.mjs "platforms/$CLI_PLATFORM/bin" > "$RUNNER_TEMP/cli-$CLI_PLATFORM.tar.gz"
      - if: runner.arch != 'X64' && matrix.platform == 'darwin-x64'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/packages/public/cli/.node-version
          architecture: x64
          package-manager-cache: false
      - name: Install the packed CLI and run it
        run: | # zizmor: ignore[adhoc-packages]
          CLI_PACKAGE_DIR=$(mktemp -d)
          CLI_VERSION=$(node -p 'require("./src/packages/public/cli/package.json").version')
          npm install --prefix "$CLI_PACKAGE_DIR" --ignore-scripts --no-audit --no-fund \
            "$RUNNER_TEMP/cli-packages/interfere-cli-$CLI_VERSION.tgz" \
            "$RUNNER_TEMP/cli-packages/interfere-cli-$CLI_PLATFORM-$CLI_VERSION.tgz"
          test "$(node "$CLI_PACKAGE_DIR/node_modules/@interfere/cli/dist/interfere.mjs" --version)" = "interfere $CLI_VERSION"
          node "$CLI_PACKAGE_DIR/node_modules/@interfere/cli/dist/interfere.mjs" problems get --schema
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.platform }}
          path: ${{ runner.temp }}/cli-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7
